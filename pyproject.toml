[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oconnect-client"
version = "0.1.0"
description = "使用独立电脑身份，通过局域网增量采集 OPPO 手表录音"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["cryptography==50.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
oconnect-client = "oconnect_client.cli:main"
oconnect-identity = "oconnect_client.identity:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oconnect_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 显式启用的已配对手机实机测试"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
